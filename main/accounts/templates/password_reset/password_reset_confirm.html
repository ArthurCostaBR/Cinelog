<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password reset</title>
</head>
<body>
    <h1>Reset password</h1>

    {% if validlink %}

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Continue</button>
        </form>

    {% else %}

        <p>
            This link has expired or is no longer available.
        </p>

    {% endif %}
</body>
</html>
