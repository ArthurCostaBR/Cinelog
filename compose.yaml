services:

  web:
    build: .

    container_name: cinelog_web
    
    volumes:
      - ./main:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:18

    container_name: cinelog_db

    restart: unless-stopped

    ports:
      -"5432:5432"

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: